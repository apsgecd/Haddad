<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ✅ Mobile optimization -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>Haddad</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
}

/* Header */
h2 {
    margin-top: 20px;
}

/* ✅ Play Button */
#toggleBtn {
    position: fixed;
    bottom: 350px;
    left: 50%;                 /* Move to the horizontal center */
    transform: translateX(-50%); /* Pull back by half its width */
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: red;
    color: white;
    font-size: 50px;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
}

/* ✅ Counter Button */
#counterBtn {
    position: fixed;
    bottom: calc(10px + env(safe-area-inset-bottom));
    
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 200px;
    font-size: 40px;
    border-radius: 70px;
    background: #222;
    color: white;
    border: none;
    touch-action: manipulation;
}

/* ✅ Reset Button */
#resetBtn {
    position: fixed;
    bottom: 170px
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 50px;
    font-size: 18px;
    border-radius: 25px;
    background: #555;
    color: white;
    border: none;
    touch-action: manipulation;
}

/* ✅ Remove tap highlight (iOS) */
button {
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>

<body>

<h2>🕌 Haddad Audio Player 🕋</h2>

<!-- ✅ Audio -->
<audio id="audioPlayer" preload="auto">
    <source src="haddad.mp3" type="audio/mpeg">
    <source src="audio-file.ogg" type="audio/ogg">
    <source src="audio-file.wav" type="audio/wav">
</audio>


<!-- 🔴 Play Button -->
<button id="toggleBtn">▶</button>

    <!-- 🔄 Reset Button -->
<button id="resetBtn">Reset</button>
    
<!-- 🔢 Counter -->
<button id="counterBtn">0</button>


<script>
const audio = document.getElementById("audioPlayer");
const btn = document.getElementById("toggleBtn");
const counterBtn = document.getElementById("counterBtn");
const resetBtn = document.getElementById("resetBtn");

/* ✅ Load saved counter */
let count = localStorage.getItem("zikrCount") || 0;
count = parseInt(count);
counterBtn.innerText = count;

/* ✅ Play / Pause */
btn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play().catch(() => {
            alert("Tap again to allow audio (iPhone restriction)");
        });
        btn.innerText = "⏸";
    } else {
        audio.pause();
        btn.innerText = "▶";
    }
});

/* ✅ Counter */
counterBtn.addEventListener("click", () => {
    count++;
    counterBtn.innerText = count;
    localStorage.setItem("zikrCount", count);

    if (navigator.vibrate) {
        navigator.vibrate(30);
    }
});

/* ✅ Reset Counter */
resetBtn.addEventListener("click", () => {
    if (confirm("Reset the counter?")) {
        count = 0;
        counterBtn.innerText = count;
        localStorage.setItem("zikrCount", count);

        if (navigator.vibrate) {
            navigator.vibrate([50, 50, 50]);
        }
    }
});

/* ✅ Service worker */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register('/Haddad/service-worker.js');
}
</script>

</body>
</html>
