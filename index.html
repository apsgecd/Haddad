<body>

<center>
    <h2>🕌 Haddad Audio Player 🕋</h2>

    <!-- Audio -->
    <audio id="audioPlayer" preload="auto">
        <source src="haddad.mp3" type="audio/mpeg">
        <source src="audio-file.ogg" type="audio/ogg">
        <source src="audio-file.wav" type="audio/wav">
        Your browser does not support the audio element.
    </audio>
</center>

<!-- Big Red Play/Pause Button -->
<button id="toggleBtn">▶</button>

<!-- Counter Button (bottom) -->
<button id="counterBtn">0</button>

<style>
/* Big red circle button */
#toggleBtn {
    position: fixed;
    bottom: 100px;
    right: 20px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background-color: red;
    color: white;
    font-size: 30px;
    border: none;
    cursor: pointer;
}

/* Counter button */
#counterBtn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 60px;
    font-size: 25px;
    border-radius: 30px;
    background-color: #333;
    color: white;
    border: none;
    cursor: pointer;
}
</style>

<script>
// Audio control
const audio = document.getElementById("audioPlayer");
const btn = document.getElementById("toggleBtn");

btn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play();
        btn.innerHTML = "⏸";
    } else {
        audio.pause();
        btn.innerHTML = "▶";
    }
});

// Counter button
let count = 0;
const counterBtn = document.getElementById("counterBtn");

counterBtn.addEventListener("click", () => {
    count++;
    counterBtn.innerText = count;
});

// Service worker
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register('/Haddad/service-worker.js');
}
</script>

</body><body>
