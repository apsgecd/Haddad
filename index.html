<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ✅ Mobile optimization -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>Haddad</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
}

/* Header */
h2 {
    margin-top: 20px;
}
<center>
/* ✅ Big Play Button */
#toggleBtn {
    position: fixed;
    bottom: 350px;
    right: 20px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: red;
    color: white;
    font-size: 50px;
    border: none;
    cursor: pointer;

    /* ✅ Better touch */
    touch-action: manipulation;
}

/* ✅ Counter Button */
#counterBtn {
    position: fixed;
    bottom: calc(60px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 200px;
    font-size: 40px;
    border-radius: 70px;
    background: #222;
    color: white;
    border: none;

    touch-action: manipulation;
}
</center>
/* ✅ Remove tap highlight (iOS) */
button {
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>

<body>

<h2>🕌 Haddad Audio Player 🕋</h2>

<!-- ✅ Audio (hidden controls) -->
<audio id="audioPlayer" preload="auto">
    <source src="haddad.mp3" type="audio/mpeg">
    <source src="audio-file.ogg" type="audio/ogg">
    <source src="audio-file.wav" type="audio/wav">
</audio>

<!-- 🔴 Play Button -->
<button id="toggleBtn">▶</button>

<!-- 🔢 Counter -->
<button id="counterBtn">0</button>

<script>
const audio = document.getElementById("audioPlayer");
const btn = document.getElementById("toggleBtn");
const counterBtn = document.getElementById("counterBtn");

/* ✅ Load saved counter */
let count = localStorage.getItem("zikrCount") || 0;
counterBtn.innerText = count;

/* ✅ Play / Pause (mobile safe) */
btn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play().catch(() => {
            alert("Tap again to allow audio (iPhone restriction)");
        });
        btn.innerText = "⏸";
    } else {
        audio.pause();
        btn.innerText = "▶";
    }
});

/* ✅ Counter */
counterBtn.addEventListener("click", () => {
    count++;
    counterBtn.innerText = count;
    localStorage.setItem("zikrCount", count);

    /* ✅ Optional vibration (mobile) */
    if (navigator.vibrate) {
        navigator.vibrate(30);
    }
});

/* ✅ Service worker */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register('/Haddad/service-worker.js');
}
</script>

</body>
</html>
