<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Haddad</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
}

h2 {
    margin-top: 70px; /* Pushed down to clear top navigation */
    text-transform: capitalize;
}

/* Top Navigation & Controls Bar */
.top-bar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    box-sizing: border-box;
    z-index: 100;
}

.nav-cluster {
    display: flex;
    align-items: center;
    gap: 10px;
}

.nav-btn {
    width: 40px;
    height: 40px;
    font-size: 20px;
    border-radius: 50%;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
}

.action-btn {
    width: 40px;
    height: 40px;
    font-size: 18px;
    border-radius: 50%;
    border: none;
    background: #eee;
    cursor: pointer;
}

#infoBtn {
    background: #007bff;
    color: white;
}

#textViewerBtn {
    background: #28a745;
    color: white;
}

/* ▶ Play Button */
#toggleBtn {
    position: fixed;
    bottom: 350px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: red;
    color: white;
    font-size: 50px;
    border: none;
}
#textBody {
    overflow-y: auto;
    flex-grow: 1;
    white-space: pre-wrap;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Cleaner for Arabic than standard monospace */
    font-size: 20px; /* Slightly larger scale for better readability of Arabic script */
    line-height: 1.6;
    background: #fafafa;
    padding: 15px;
    border-radius: 5px;
    direction: rtl;  /* Forces text direction layout to run Right-to-Left */
    text-align: right; /* Aligns text flow cleanly to the right boundary */
}
/* ⏪ Back 5 sec */
#backBtn {
    position: fixed;
    bottom: 350px;
    left: calc(50% - 110px);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #444;
    color: white;
    font-size: 30px;
    border: none;
}

/* ⏩ Forward 5 sec */
#forwardBtn {
    position: fixed;
    bottom: 350px;
    left: calc(50% + 40px);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #444;
    color: white;
    font-size: 30px;
    border: none;
}
.modal-full {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    z-index: 2000; /* Ensures visibility over player layout controls */
    box-sizing: border-box;
}

.modal-content-full {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 15px) 15px env(safe-area-inset-bottom, 15px) 15px;
    box-sizing: border-box;
    background: inherit; /* Dynamically inherits parent inversion state */
}

.modal-header-full {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid #ccc;
    background: inherit;
}

.modal-header-full h3 {
    margin: 0;
    font-size: 18px;
}

.control-cluster {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* Invert Color Mode Adjustments */
.dark-mode-view {
    background: #121212 !important;
    color: #f0f0f0 !important;
}
.dark-mode-view .modal-body-full {
    background: #1e1e1e !important;
    color: #f0f0f0 !important;
    border-color: #333;
}
.dark-mode-view button {
    background: #333 !important;
    color: #fff !important;
    border-color: #555 !important;
}
.dark-mode-view .close-btn {
    background: #b22222 !important;
}

/* Maximized Text Content Window */
.modal-body-full {
    overflow-y: auto;
    flex-grow: 1;
    white-space: pre-wrap;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 22px; /* Amplified visibility scale for Arabic script */
    line-height: 1.7;
    background: #fafafa;
    padding: 15px;
    margin-top: 10px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    direction: rtl;
    text-align: right;
    -webkit-overflow-scrolling: touch; /* Smooth inertial scrolling on iOS devices */
}
/* Counter Button */
#counterBtn {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 300px;
    font-size: 40px;
    background: grey;
    color: black;
    border: none;
}

/* Reset Button */
#resetBtn {
    position: fixed;
    top: 130px; /* Moved down slightly to accommodate header */
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 50px;
    font-size: 18px;
    border-radius: 25px;
    background: #555;
    color: white;
    border: none;
}

/* Modals / Overlays */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    box-sizing: border-box;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 500px;
    height: 80vh;
    margin: 5vh auto;
    border-radius: 10px;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    text-align: left;
    display: flex;
    flex-direction: column;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

.modal-body {
    overflow-y: auto;
    flex-grow: 1;
    white-space: pre-wrap;
    font-family: monospace;
    background: #fafafa;
    padding: 10px;
    border-radius: 5px;
}

.close-btn {
    background: #dc3545;
    color: white;
    border: none;
    padding: 5px 15px;
    border-radius: 5px;
    font-size: 16px;
}

.txt-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

button {
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>

<body>

<!-- Top Control Area -->
<div class="top-bar">
    <div class="nav-cluster">
        <button class="nav-btn" id="prevAudioBtn">◀</button>
        <button class="nav-btn" id="nextAudioBtn">▶</button>
    </div>
    <div class="nav-cluster">
        <button class="action-btn" id="textViewerBtn">📄</button>
        <button class="action-btn" id="infoBtn">ℹ</button>
    </div>
</div>

<h2 id="pageTitle">🕌 Haddad 🕋</h2>

<audio id="audioPlayer" preload="auto">
    <source id="audioSource" src="haddad.mp3" type="audio/mpeg">
</audio>

<!-- iPhone haptic click sound -->
<audio id="clickShort" src="click.mp3" preload="auto"></audio>
<audio id="clickLong" src="longclick.mp3" preload="auto"></audio>

<!-- Controls -->
<button id="backBtn">⏪</button>
<button id="toggleBtn">▶</button>
<button id="forwardBtn">⏩</button>

<button id="resetBtn">Reset</button>
<button id="counterBtn">0</button>


<!-- Logs Modal (ℹ) -->
<div id="logsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>System & Cache Logs</h3>
            <button class="close-btn" onclick="closeModal('logsModal')">X</button>
        </div>
        <div id="logsBody" class="modal-body">Loading environment logs...</div>
    </div>
</div>

<!-- Text File Viewer Modal -->
<!-- Full-Screen Text File Viewer Modal -->
<div id="textModal" class="modal-full">
    <div class="modal-content-full">
        <div class="modal-header-full">
            <h3 id="txtFileName">Document Viewer</h3>
            <div class="control-cluster">
                <button class="action-btn" id="invertColorsBtn" style="font-size: 16px; border-radius: 5px; width: auto; padding: 5px 10px;">🌓 Mode</button>
                <button class="close-btn" onclick="closeModal('textModal')">Close</button>
            </div>
        </div>
        
        <!-- Document Page Navigators -->
        <div class="txt-nav" style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
            <button class="nav-btn" id="prevTxtBtn">◀</button>
            <button class="nav-btn" id="nextTxtBtn">▶</button>
        </div>
        
        <div id="textBody" class="modal-body-full">Loading file contents...</div>
    </div>
</div>


<script>
// UI Management Elements
const audio = document.getElementById("audioPlayer");
const audioSource = document.getElementById("audioSource");
const pageTitle = document.getElementById("pageTitle");

const btn = document.getElementById("toggleBtn");
const counterBtn = document.getElementById("counterBtn");
const resetBtn = document.getElementById("resetBtn");
const backBtn = document.getElementById("backBtn");
const forwardBtn = document.getElementById("forwardBtn");

// Media arrays setup
const audioFiles = ["haddad.mp3", "names.mp3", "yaseen.mp3", "kahf.mp3"];
let currentAudioIndex = 0;

const txtFiles = ["yaseen.txt", "kahf.txt", "99names.txt"];
let currentTxtIndex = 0;

/* Detect iPhone */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

/* Load saved counter */
let count = parseInt(localStorage.getItem("zikrCount") || 0);
counterBtn.innerText = count;

/* Dynamic Track Engine Initialization */
function loadTrack(index) {
    currentAudioIndex = index;
    const filename = audioFiles[currentAudioIndex];
    const trackName = filename.replace('.mp3', '');
    
    // Update DOM titles dynamic structure
    pageTitle.innerHTML = `🕌 ${trackName} 🕋`;
    document.title = trackName.charAt(0).toUpperCase() + trackName.slice(1);
    
    // Refresh audio context
    audio.pause();
    audioSource.src = filename;
    audio.load();
    btn.innerText = "▶";
}

// Track selection Event Listeners
document.getElementById("prevAudioBtn").addEventListener("click", () => {
    let index = currentAudioIndex - 1 < 0 ? audioFiles.length - 1 : currentAudioIndex - 1;
    loadTrack(index);
});

document.getElementById("nextAudioBtn").addEventListener("click", () => {
    let index = currentAudioIndex + 1 >= audioFiles.length ? 0 : currentAudioIndex + 1;
    loadTrack(index);
});


/* Text Viewer Engine Initialization */
function loadTxtFile(index) {
    currentTxtIndex = index;
    const currentFile = txtFiles[currentTxtIndex];
    document.getElementById("txtFileName").innerText = currentFile;
    
    fetch(currentFile)
        .then(res => {
            if(!res.ok) throw new Error(`HTTP Status error ${res.status}`);
            return res.text();
        })
        .then(text => {
            document.getElementById("textBody").innerText = text;
        })
        .catch(err => {
            document.getElementById("textBody").innerText = `Failed to process layout resource file: ${currentFile}\nVerify file availability at local root directory context.`;
        });
}

document.getElementById("prevTxtBtn").addEventListener("click", () => {
    let idx = currentTxtIndex - 1 < 0 ? txtFiles.length - 1 : currentTxtIndex - 1;
    loadTxtFile(idx);
});

document.getElementById("nextTxtBtn").addEventListener("click", () => {
    let idx = currentTxtIndex + 1 >= txtFiles.length ? 0 : currentTxtIndex + 1;
    loadTxtFile(idx);
});


/* Modal Utilities */
function openModal(id) {
    document.getElementById(id).style.display = "block";
}
function closeModal(id) {
    document.getElementById(id).style.display = "none";
}

document.getElementById("textViewerBtn").addEventListener("click", () => {
    openModal("textModal");
    loadTxtFile(currentTxtIndex);
});

document.getElementById("infoBtn").addEventListener("click", async () => {
    openModal("logsModal");
    const logContainer = document.getElementById("logsBody");
    logContainer.innerText = "Querying environment descriptors...";
    
    let logs = `[System Parameters]\nTimestamp: ${new Date().toISOString()}\nPlatform OS Target: ${navigator.platform}\nIOS Device Flag: ${isIOS}\n\n`;
    
    // Inspect Service Worker status wrapper context
    if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        logs += `[Service Workers]\nActive scopes found: ${regs.length}\n`;
        regs.forEach((r, i) => logs += ` -> Context [${i}]: ${r.scope}\n`);
    } else {
        logs += `[Service Workers]\nNot supported in runtime environment.\n`;
    }
    
    // Inspect Cache API state logs
    if ('caches' in window) {
        logs += `\n[Cache Storage Subsystem]\n`;
        const keys = await caches.keys();
        if(keys.length === 0) logs += "No functional local cache stores mapped.\n";
        for (let key of keys) {
            logs += `Cache target: "${key}"\n`;
            const openedCache = await caches.open(key);
            const requests = await openedCache.keys();
            requests.forEach(req => logs += `  -> Cached assets payload URL: ${req.url}\n`);
        }
    } else {
        logs += `\n[Cache Storage Subsystem]\nNot supported in environment context.\n`;
    }
    
    logContainer.innerText = logs;
});


/* Play / Pause */
btn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play().catch(() => alert("Tap again to allow audio"));
        btn.innerText = "⏸";
    } else {
        audio.pause();
        btn.innerText = "▶";
    }
});

/* ⏪ Back 5 seconds */
backBtn.addEventListener("click", () => {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
});

/* ⏩ Forward 5 seconds */
forwardBtn.addEventListener("click", () => {
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
});

function haptic(type) {
    if (isIOS) {
        const clickShort = document.getElementById("clickShort");
        const clickLong = document.getElementById("clickLong");
        
        if (type === "short") {
            clickShort.currentTime = 0;
            clickShort.play().catch(()=>{});
        }
        if (type === "long") {
            clickLong.currentTime = 0;
            clickLong.play().catch(()=>{});
        }
        if (type === "double") {
            clickLong.currentTime = 0;
            clickLong.play().catch(()=>{});
            setTimeout(() => {
                clickLong.currentTime = 0;
                clickLong.play().catch(()=>{});
            }, 200);
        }
    } else {
        if (type === "short") navigator.vibrate(40);
        if (type === "long") navigator.vibrate(250);
        if (type === "double") navigator.vibrate([200, 150, 200]);
    }
}

/* Counter + Haptics */
counterBtn.addEventListener("click", () => {
    count++;
    counterBtn.innerText = count;
    localStorage.setItem("zikrCount", count);

    if (count % 33 === 0) {
        haptic("double");
    } else if (count % 11 === 0) {
        haptic("long");
    } else {
        haptic("short");
    }
});

/* Reset */
resetBtn.addEventListener("click", () => {
    if (confirm("Reset the counter?")) {
        count = 0;
        counterBtn.innerText = 0;
        localStorage.setItem("zikrCount", 0);
        haptic("double");
    }
});

    // Color inversion tracking parameter
let isDarkTheme = false;

// Color Inversion Action Trigger
document.getElementById("invertColorsBtn").addEventListener("click", () => {
    const modalTarget = document.getElementById("textModal");
    isDarkTheme = !isDarkTheme;
    
    if (isDarkTheme) {
        modalTarget.classList.add("dark-mode-view");
    } else {
        modalTarget.classList.remove("dark-mode-view");
    }
    haptic("short"); // Provides contextual confirmation trigger
});

/* Update your existing openModal/closeModal handlers to safely manipulate layout views */
function openModal(id) {
    document.getElementById(id).style.display = (id === "textModal") ? "block" : "block"; 
    // This allows .modal-full and standard logs modal to operate on display block toggling
}

function closeModal(id) {
    document.getElementById(id).style.display = "none";
}
</script>

</body>
</html>
