<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Haddad</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
}

h2 {
    margin-top: 20px;
}

/* ▶ Play Button */
#toggleBtn {
    position: fixed;
    bottom: 350px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: red;
    color: white;
    font-size: 50px;
    border: none;
}

/* ⏪ Back 5 sec */
#backBtn {
    position: fixed;
    bottom: 350px;
    left: calc(50% - 150px);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #444;
    color: white;
    font-size: 30px;
    border: none;
}

/* ⏩ Forward 5 sec */
#forwardBtn {
    position: fixed;
    bottom: 350px;
    left: calc(50% + 150px);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #444;
    color: white;
    font-size: 30px;
    border: none;
}

/* Counter Button */
#counterBtn {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 300px;
    font-size: 40px;
    background: #111;
    color: white;
    border: none;
}

/* Reset Button */
#resetBtn {
    position: fixed;
    bottom: 170px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 50px;
    font-size: 18px;
    border-radius: 25px;
    background: #555;
    color: white;
    border: none;
}

button {
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>

<body>

<h2>🕌 Haddad Audio Player 🕋</h2>

<audio id="audioPlayer" preload="auto">
    <source src="haddad.mp3" type="audio/mpeg">
</audio>

<!-- iPhone haptic click sound -->
<audio id="hapticClick" src="click.mp3" preload="auto"></audio>

<!-- Buttons -->
<button id="backBtn">⏪</button>
<button id="toggleBtn">▶</button>
<button id="forwardBtn">⏩</button>

<button id="resetBtn">Reset</button>
<button id="counterBtn">0</button>

<script>
const audio = document.getElementById("audioPlayer");
const clickSound = document.getElementById("hapticClick");

const btn = document.getElementById("toggleBtn");
const counterBtn = document.getElementById("counterBtn");
const resetBtn = document.getElementById("resetBtn");
const backBtn = document.getElementById("backBtn");
const forwardBtn = document.getElementById("forwardBtn");

/* Detect iPhone */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

/* Load saved counter */
let count = parseInt(localStorage.getItem("zikrCount") || 0);
counterBtn.innerText = count;

/* Play / Pause */
btn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play().catch(() => alert("Tap again to allow audio"));
        btn.innerText = "⏸";
    } else {
        audio.pause();
        btn.innerText = "▶";
    }
});

/* ⏪ Back 5 seconds */
backBtn.addEventListener("click", () => {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
});

/* ⏩ Forward 5 seconds */
forwardBtn.addEventListener("click", () => {
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
});

/* Haptic function */
function haptic(type) {
    if (isIOS) {
        // iPhone fallback: play click sound
        clickSound.currentTime = 0;
        clickSound.play();
    } else {
        // Android vibration
        if (type === "short") navigator.vibrate(40);
        if (type === "long") navigator.vibrate(200);
        if (type === "double") navigator.vibrate([200, 150, 200]);
    }
}

/* Counter + Haptics */
counterBtn.addEventListener("click", () => {
    count++;
    counterBtn.innerText = count;
    localStorage.setItem("zikrCount", count);

    if (count % 33 === 0) {
        haptic("double");
    } else if (count % 11 === 0) {
        haptic("long");
    } else {
        haptic("short");
    }
});

/* Reset */
resetBtn.addEventListener("click", () => {
    if (confirm("Reset the counter?")) {
        count = 0;
        counterBtn.innerText = 0;
        localStorage.setItem("zikrCount", 0);
        haptic("double");
    }
});
</script>

</body>
</html>
